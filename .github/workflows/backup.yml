name: Kopia bazy i podtrzymanie projektu

on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Zapytanie do API (projekt pozostaje aktywny)
        run: |
          curl -fsS -o /dev/null "${{ vars.VITE_SUPABASE_URL }}/rest/v1/channels?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}"
          echo "Projekt Supabase odpowiada."

  backup:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Kopia bazy (schemat public, schemat i dane)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "Brak sekretu SUPABASE_DB_URL"; exit 1; }
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges' > kopia.sql
          echo "Rozmiar kopii: $(du -h kopia.sql | cut -f1)"
          test -s kopia.sql
      - name: Szyfrowanie
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$PASS" || { echo "Brak sekretu BACKUP_PASSPHRASE"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 \
            -o "kopia-bazy-$(date +%F).sql.gpg" kopia.sql
          rm kopia.sql
      - uses: actions/upload-artifact@v4
        with:
          name: kopia-bazy-${{ github.run_number }}
          path: "*.sql.gpg"
          retention-days: 90
